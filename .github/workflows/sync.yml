name: Sync Live Sources
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync live sources
        run: |
          # Sync fan.txt (spider)
          curl -sL "https://gitlab.com/fantaiying/fty/-/raw/main/jar/fan.txt" -o jar/fan.txt || true
          # Sync drpy2
          curl -sL "https://gitlab.com/fantaiying/ext/-/raw/main/drpy2.min.js" -o FTY/drpy2.min.js || true
          curl -sL "https://gitlab.com/fantaiying/ext/-/raw/main/drpy2.js" -o FTY/drpy2.js || true
      - name: Commit and push
        run: |
          git config user.email "trysknee01@users.noreply.github.com"
          git config user.name "Trysknee01"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "auto sync: $(date -u +%Y-%m-%d)"
          git push
