name: Auto Sync Config

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - run: pip install requests

      - run: python sync.py

      - run: |
          git config user.email "trysknee01@users.noreply.github.com"
          git config user.name "Trysknee01"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "auto sync: $(date -u +%Y-%m-%d)"
          git push
